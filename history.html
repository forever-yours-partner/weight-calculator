<!DOCTYPE html>
<html lang="en" data-title="title.history">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill History</title>
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div>
      <div class="company" id="companyName"></div>
      <div class="company-sub" id="companySub"></div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="langBtn" type="button" data-i18n-title="lang.toggle">தமிழ்</button>
      <button class="icon-btn" id="themeBtn" type="button" data-i18n-title="theme.toggle">🌙</button>
      <a class="btn ghost small" href="app.html" data-i18n="nav.calculator" style="text-decoration:none">← Calculator</a>
      <button class="btn ghost small" id="pwdBtn" type="button" data-i18n="nav.password">Password</button>
      <button class="btn ghost small" id="logoutBtn" type="button" data-i18n="nav.logout">Logout</button>
    </div>
  </div>
</header>

<main class="container">
  <div class="hero">
    <div>
      <h1 data-i18n="hist.title">Bill History</h1>
      <p data-i18n="hist.sub"></p>
    </div>
  </div>

  <div class="msg" id="msg"></div>

  <div class="search-row">
    <input type="search" id="searchInput" data-i18n-ph="hist.search" autocomplete="off">
    <span class="count" id="billCount"></span>
  </div>

  <div id="billList"></div>
</main>

<script src="jspdf.umd.min.js"></script>
<script src="jspdf.plugin.autotable.min.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-bundle.js"></script>
<script src="i18n.js"></script>
<script src="calc.js"></script>
<script src="pdf.js"></script>
<script src="auth.js"></script>
<script src="account.js"></script>
<script src="history.js"></script>
</body>
</html>
