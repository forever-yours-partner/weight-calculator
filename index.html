<!DOCTYPE html>
<html lang="en" data-title="title.login">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – Weight Calculator</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script src="theme.js"></script>
</head>
<body>

<div class="corner">
  <button class="icon-btn" id="langBtn" type="button" data-i18n-title="lang.toggle">தமிழ்</button>
  <button class="icon-btn" id="themeBtn" type="button" data-i18n-title="theme.toggle">🌙</button>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    <h1 data-i18n="app.name">Weight &amp; Amount Calculator</h1>
    <p class="sub" data-i18n="login.sub">Sign in to your company account</p>

    <div class="tabs">
      <button class="tab active" id="tabLogin" type="button" data-i18n="tab.login">Login</button>
      <button class="tab" id="tabRegister" type="button" data-i18n="tab.register">Register</button>
    </div>

    <div class="msg" id="msg"></div>

    <!-- LOGIN -->
    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="loginUser" data-i18n="f.userOrEmail">Username or Email</label>
        <input type="text" id="loginUser" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="loginPass" data-i18n="f.password">Password</label>
        <input type="password" id="loginPass" autocomplete="current-password" required>
      </div>
      <button class="btn block" type="submit" data-i18n="btn.login">Login</button>
      <div class="link-row">
        <button class="link-btn" id="forgotLink" type="button" data-i18n="link.forgot">Forgot password?</button>
      </div>
    </form>

    <!-- FORGOT PASSWORD -->
    <form id="forgotForm" class="hidden" autocomplete="on">
      <h2 data-i18n="forgot.title">Reset your password</h2>
      <p class="hint" style="margin-bottom:14px" data-i18n="forgot.help"></p>
      <div class="field">
        <label for="forgotUser" data-i18n="f.userOrEmail">Username or Email</label>
        <input type="text" id="forgotUser" autocomplete="username" required>
      </div>
      <button class="btn block" type="submit" data-i18n="btn.sendReset">Send reset link</button>
      <div class="link-row">
        <button class="link-btn" id="backLink" type="button" data-i18n="link.back">Back to login</button>
      </div>
    </form>

    <!-- REGISTER -->
    <form id="registerForm" class="hidden" autocomplete="on">
      <div class="field">
        <label for="regCompany" data-i18n="reg.company">Company Name *</label>
        <input type="text" id="regCompany" maxlength="80" required>
      </div>
      <div class="field">
        <label for="regAddress" data-i18n="reg.address">Company Address *</label>
        <textarea id="regAddress" rows="2" maxlength="160" required></textarea>
      </div>
      <div class="row-2">
        <div class="field">
          <label for="regPhone" data-i18n="reg.phone">Phone *</label>
          <input type="tel" id="regPhone" maxlength="25" autocomplete="tel" required>
        </div>
        <div class="field">
          <label for="regEmail" data-i18n="reg.email">Email *</label>
          <input type="email" id="regEmail" maxlength="80" autocomplete="email" required>
          <div class="hint" data-i18n="reg.emailHint">Used to reset your password.</div>
        </div>
      </div>
      <div class="field">
        <label for="regUser" data-i18n="reg.username">Username *</label>
        <input type="text" id="regUser" maxlength="30" autocomplete="username" required>
        <div class="hint" data-i18n="reg.usernameHint">3–30 characters: letters, numbers, dot, underscore.</div>
      </div>
      <div class="row-2">
        <div class="field">
          <label for="regPass" data-i18n="reg.password">Password *</label>
          <input type="password" id="regPass" autocomplete="new-password" required>
          <div class="hint" data-i18n="reg.passwordHint">At least 6 characters.</div>
        </div>
        <div class="field">
          <label for="regPass2" data-i18n="reg.confirm">Confirm Password *</label>
          <input type="password" id="regPass2" autocomplete="new-password" required>
        </div>
      </div>
      <button class="btn block" type="submit" data-i18n="btn.create">Create Account</button>
    </form>
  </div>
</div>

<script src="firebase-config.js"></script>
<script src="firebase-bundle.js"></script>
<script src="i18n.js"></script>
<script src="auth.js"></script>
<script>
  // Already signed in? Go straight to the calculator.
  Auth.whenReady().then(function (u) { if (u) window.location.replace("app.html"); }).catch(function () {});

  const $ = (id) => document.getElementById(id);
  const msg = $("msg");
  let lastMsg = null; // { key | text, type } so the message can be re-translated

  function show(textOrKey, type, isKey) {
    lastMsg = { v: textOrKey, type, isKey: !!isKey };
    renderMsg();
  }
  function renderMsg() {
    if (!lastMsg) return;
    msg.textContent = lastMsg.isKey ? t(lastMsg.v) : lastMsg.v;
    msg.className = "msg show " + lastMsg.type;
  }
  function clearMsg() { lastMsg = null; msg.className = "msg"; msg.textContent = ""; }
  I18N.onChange(renderMsg);

  function showForm(which) {
    $("loginForm").classList.toggle("hidden", which !== "login");
    $("forgotForm").classList.toggle("hidden", which !== "forgot");
    $("registerForm").classList.toggle("hidden", which !== "register");
    $("tabLogin").classList.toggle("active", which !== "register");
    $("tabRegister").classList.toggle("active", which === "register");
    clearMsg();
  }
  $("tabLogin").addEventListener("click", () => showForm("login"));
  $("tabRegister").addEventListener("click", () => showForm("register"));
  $("forgotLink").addEventListener("click", () => {
    const typed = $("loginUser").value;
    showForm("forgot");
    $("forgotUser").value = typed;
    $("forgotUser").focus();
  });
  $("backLink").addEventListener("click", () => showForm("login"));

  function busy(btn, on, key) {
    if (on) { btn.disabled = true; btn.textContent = t("btn.wait"); }
    else { btn.disabled = false; btn.textContent = t(key); }
  }

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearMsg();
    const btn = e.target.querySelector("button[type=submit]");
    busy(btn, true);
    const res = await Auth.login($("loginUser").value, $("loginPass").value);
    if (res.ok) { window.location.href = "app.html"; return; }
    busy(btn, false, "btn.login");
    show(res.error, "err");
  });

  $("forgotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearMsg();
    const btn = e.target.querySelector("button[type=submit]");
    busy(btn, true);
    const res = await Auth.sendReset($("forgotUser").value);
    busy(btn, false, "btn.sendReset");
    if (res.ok) show("forgot.sent", "ok", true);
    else show(res.error, "err");
  });

  $("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearMsg();
    const username = $("regUser").value.trim();
    const pass = $("regPass").value;

    if (!/^[A-Za-z0-9_.]{3,30}$/.test(username)) return show("reg.errUser", "err", true);
    if (pass.length < 6) return show("reg.errPass", "err", true);
    if (pass !== $("regPass2").value) return show("reg.errMatch", "err", true);

    const btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true; btn.textContent = t("btn.creating");

    const res = await Auth.register({
      company: $("regCompany").value,
      address: $("regAddress").value,
      phone: $("regPhone").value,
      email: $("regEmail").value,
      username,
      password: pass,
    });

    btn.disabled = false; btn.textContent = t("btn.create");
    if (!res.ok) return show(res.error, "err");

    $("registerForm").reset();
    showForm("login");
    $("loginUser").value = res.username;
    $("loginPass").focus();
    show("reg.ok", "ok", true);
  });
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
</script>
</body>
</html>
