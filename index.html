<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – Weight Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Weight &amp; Amount Calculator</h1>
    <p class="sub">Sign in to your company account</p>

    <div class="tabs">
      <button class="tab active" id="tabLogin" type="button">Login</button>
      <button class="tab" id="tabRegister" type="button">Register</button>
    </div>

    <div class="msg" id="msg"></div>

    <!-- LOGIN -->
    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="loginUser">Username</label>
        <input type="text" id="loginUser" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="loginPass">Password</label>
        <input type="password" id="loginPass" autocomplete="current-password" required>
      </div>
      <button class="btn block" type="submit">Login</button>
    </form>

    <!-- REGISTER -->
    <form id="registerForm" class="hidden" autocomplete="on">
      <div class="field">
        <label for="regCompany">Company Name *</label>
        <input type="text" id="regCompany" maxlength="80" required>
      </div>
      <div class="field">
        <label for="regAddress">Company Address *</label>
        <textarea id="regAddress" rows="2" maxlength="160" required></textarea>
      </div>
      <div class="row-2">
        <div class="field">
          <label for="regPhone">Phone *</label>
          <input type="tel" id="regPhone" maxlength="25" autocomplete="tel" required>
        </div>
        <div class="field">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" maxlength="80" autocomplete="email">
        </div>
      </div>
      <div class="field">
        <label for="regUser">Username *</label>
        <input type="text" id="regUser" maxlength="30" autocomplete="username" required>
        <div class="hint">3–30 characters: letters, numbers, dot, underscore.</div>
      </div>
      <div class="row-2">
        <div class="field">
          <label for="regPass">Password *</label>
          <input type="password" id="regPass" autocomplete="new-password" required>
          <div class="hint">At least 6 characters.</div>
        </div>
        <div class="field">
          <label for="regPass2">Confirm Password *</label>
          <input type="password" id="regPass2" autocomplete="new-password" required>
        </div>
      </div>
      <button class="btn block" type="submit">Create Account</button>
    </form>
  </div>
</div>

<script src="auth.js"></script>
<script>
  // Already signed in? Go straight to the calculator.
  if (Auth.currentUser()) window.location.replace("app.html");

  const $ = (id) => document.getElementById(id);
  const msg = $("msg");

  function show(text, type) {
    msg.textContent = text;
    msg.className = "msg show " + type;
  }
  function clearMsg() { msg.className = "msg"; msg.textContent = ""; }

  function switchTab(which) {
    const isLogin = which === "login";
    $("loginForm").classList.toggle("hidden", !isLogin);
    $("registerForm").classList.toggle("hidden", isLogin);
    $("tabLogin").classList.toggle("active", isLogin);
    $("tabRegister").classList.toggle("active", !isLogin);
    clearMsg();
  }
  $("tabLogin").addEventListener("click", () => switchTab("login"));
  $("tabRegister").addEventListener("click", () => switchTab("register"));

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearMsg();
    const res = await Auth.login($("loginUser").value, $("loginPass").value);
    if (res.ok) window.location.href = "app.html";
    else show(res.error, "err");
  });

  $("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearMsg();
    const username = $("regUser").value.trim();
    const pass = $("regPass").value;

    if (!/^[A-Za-z0-9_.]{3,30}$/.test(username)) {
      return show("Username must be 3–30 characters: letters, numbers, dot or underscore.", "err");
    }
    if (pass.length < 6) return show("Password must be at least 6 characters.", "err");
    if (pass !== $("regPass2").value) return show("The two passwords do not match.", "err");

    const res = await Auth.register({
      company: $("regCompany").value,
      address: $("regAddress").value,
      phone: $("regPhone").value,
      email: $("regEmail").value,
      username,
      password: pass,
    });

    if (!res.ok) return show(res.error, "err");

    $("registerForm").reset();
    switchTab("login");
    $("loginUser").value = res.username;
    $("loginPass").focus();
    show("Account created. Please login with your username and password.", "ok");
  });
</script>
</body>
</html>
