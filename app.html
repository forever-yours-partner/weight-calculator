<!DOCTYPE html>
<html lang="en" data-title="title.app">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weight Calculator</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script src="theme.js"></script>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div>
      <div class="company" id="companyName"></div>
      <div class="company-sub" id="companySub"></div>
    </div>
    <div class="topbar-actions">
      <span class="per-chip"><span data-i18n="perAmount.label">Per Amount</span>: <strong id="perAmountTop"></strong></span>
      <span class="user-chip"><span data-i18n="user.label">User:</span> <span id="userName"></span></span>
      <button class="icon-btn" id="langBtn" type="button" data-i18n-title="lang.toggle">தமிழ்</button>
      <button class="icon-btn" id="themeBtn" type="button" data-i18n-title="theme.toggle">🌙</button>
      <a class="btn ghost small" href="history.html" data-i18n="nav.history" style="text-decoration:none">History</a>
      <button class="btn ghost small" id="pwdBtn" type="button" data-i18n="nav.password">Password</button>
      <button class="btn ghost small" id="logoutBtn" type="button" data-i18n="nav.logout">Logout</button>
    </div>
  </div>
</header>

<main class="container">

  <div class="hero">
    <div>
      <h1 data-i18n="app.name">Weight &amp; Amount Calculator</h1>
      <p data-i18n="app.sub"></p>
      <div class="sync" id="syncStatus"></div>
      <div class="badge hidden" id="billBadge"></div>
    </div>
    <!-- Per Amount: top right, always visible -->
    <div class="per-card">
      <div class="label" data-i18n="perAmount.label">Per Amount</div>
      <div class="value" id="perAmountValue"></div>
      <div class="unit" data-i18n="perAmount.unit"></div>
    </div>
  </div>

  <div class="msg" id="msg"></div>

  <!-- Customer (optional) -->
  <section class="card">
    <div class="field" style="margin-bottom:0">
      <label for="customerName"><span data-i18n="customer.label">Customer Name</span> <span class="opt" data-i18n="optional">(optional)</span></label>
      <input type="text" id="customerName" maxlength="80" data-i18n-ph="customer.ph" placeholder="Enter customer name" autocomplete="off">
    </div>
  </section>

  <!-- 1. Item weights -->
  <section class="card">
    <h2><span class="step">1</span> <span data-i18n="s1.title">Item Weights (kg)</span></h2>
    <div class="add-row">
      <input type="number" id="weightInput" inputmode="decimal" step="any" min="0">
      <button class="btn" id="addBtn" type="button" data-i18n="btn.add">Add</button>
    </div>
    <div class="counter">
      <span id="itemCount"></span>
      <span data-i18n="items.enterHint">Press Enter to add quickly</span>
    </div>
    <div class="items" id="itemList"></div>

    <div class="actions">
      <button class="btn green" id="calcWeightBtn" type="button" data-i18n="btn.calcWeight">Calculate Total Weight</button>
      <button class="btn danger-ghost" id="clearItemsBtn" type="button" data-i18n="btn.clearItems">Clear All Items</button>
    </div>

    <div class="result">
      <span class="rl" data-i18n="totalWeight.label">Total Weight (kg)</span>
      <span class="rv" id="totalWeightValue">—</span>
    </div>
  </section>

  <!-- 2. Net weight and net amount -->
  <section class="card">
    <h2><span class="step">2</span> <span data-i18n="s2.title">Net Weight &amp; Net Amount</span></h2>
    <div class="field">
      <label for="netWeight" data-i18n="netWeight.label">Net Weight (kg)</label>
      <input type="number" id="netWeight" inputmode="decimal" step="any" min="0" data-i18n-ph="netWeight.ph">
    </div>
    <div class="field">
      <label for="netAmount" data-i18n="netAmount.label">Net Amount (Rs)</label>
      <input type="number" id="netAmount" inputmode="decimal" step="any" min="0" data-i18n-ph="netAmount.ph">
    </div>
    <div class="hint" data-i18n="s2.hint"></div>

    <div class="result" style="margin-top:16px">
      <span class="rl" data-i18n="quotient.label">Total Weight ÷ Net Weight</span>
      <span class="rv" id="quotientValue">—</span>
    </div>
    <div class="result split">
      <span class="rl" data-i18n="split.label">Items &amp; Balance Weight</span>
      <span class="rv" id="splitValue">—</span>
    </div>
    <div class="hint" style="margin-top:8px" data-i18n="split.hint"></div>
  </section>

  <!-- 3. Total amount -->
  <section class="card">
    <h2><span class="step">3</span> <span data-i18n="s3.title">Total Amount</span></h2>
    <div class="actions" style="margin-top:0">
      <button class="btn green" id="calcAmountBtn" type="button" data-i18n="btn.calcAmount">Calculate Total Amount</button>
    </div>
    <div class="result total">
      <span class="rl" data-i18n="totalAmount.label">Total Amount (Rs)</span>
      <span class="rv" id="totalAmountValue">—</span>
    </div>
    <div class="hint" style="margin-top:8px" data-i18n="s3.hint"></div>
  </section>

  <div class="footer-actions">
    <button class="btn green" id="saveBillBtn" type="button" data-i18n="btn.saveBill">Save Bill</button>
    <button class="btn" id="pdfBtn" type="button" data-i18n="btn.pdf">Download PDF</button>
    <button class="btn ghost" id="newBillBtn" type="button" data-i18n="btn.newBill">New Bill</button>
  </div>

</main>

<script src="jspdf.umd.min.js"></script>
<script src="jspdf.plugin.autotable.min.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-bundle.js"></script>
<script src="i18n.js"></script>
<script src="calc.js"></script>
<script src="pdf.js"></script>
<script src="auth.js"></script>
<script src="account.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
</script>
</body>
</html>
